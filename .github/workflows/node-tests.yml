name: Node tests

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node-tests:
    name: node-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
      - run: python3 scripts/build-release.py v1.2.0
      - run: python3 -m zipfile -t dist/SLUM-v1.2.0.zip
      - run: python3 -m zipfile -t dist/SLUM-Siril-v1.2.0.zip

  python-tests:
    name: python-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy
      - run: python -m unittest discover -s tests/siril -p "test_*.py"
